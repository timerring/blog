<svg xmlns="http://www.w3.org/2000/svg" id="range-hash" class="logic2image" role="img" aria-labelledby="range-hash-title" aria-describedby="range-hash-desc" viewBox="0 0 680 700" width="680" height="700" style="max-width:100%;height:auto"><title id="range-hash-title">Range routing and the cost of changing modulo</title><desc id="range-hash-desc">Range splits months. Modulo example maps IDs 0 through 7 from two shards to four. IDs 2,6,3,7 move; four other IDs stay.</desc><style>#range-hash text {font-family: Georgia, serif;}</style><defs><marker id="range-hash-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9 z" fill="context-stroke"/></marker></defs><rect width="680" height="700" fill="#ffffff"/><g data-rg-content="true"><text x="340" y="36" text-anchor="middle" font-size="23" fill="#383a42" data-rg-title="true"><tspan x="340" dy="0">Range routing and the cost of changing modulo</tspan></text>
<text x="340" y="90" text-anchor="middle" font-size="18" fill="#015f88"><tspan x="340" dy="0">Range: one destination per time interval</tspan></text>
<rect data-rg-kind="shape" data-rg-role="teal" x="20" y="125" width="190" height="56" rx="8" fill="#e1f3fa" stroke="#0184bc" stroke-width="1.5"/>
<text x="115.0" y="159.0" text-anchor="middle" font-size="18" fill="#015f88"><tspan x="115.0" dy="0">Jan orders</tspan></text>
<rect data-rg-kind="shape" data-rg-role="teal" x="245" y="125" width="190" height="56" rx="8" fill="#e1f3fa" stroke="#0184bc" stroke-width="1.5"/>
<text x="340.0" y="159.0" text-anchor="middle" font-size="18" fill="#015f88"><tspan x="340.0" dy="0">Feb orders</tspan></text>
<rect data-rg-kind="shape" data-rg-role="teal" x="470" y="125" width="190" height="56" rx="8" fill="#e1f3fa" stroke="#0184bc" stroke-width="1.5"/>
<text x="565.0" y="159.0" text-anchor="middle" font-size="18" fill="#015f88"><tspan x="565.0" dy="0">Mar orders</tspan></text>
<text x="340" y="220" text-anchor="middle" font-size="18" fill="#383a42"><tspan x="340" dy="0">New month → new table; recent writes may concentrate</tspan></text>
<text x="340" y="295" text-anchor="middle" font-size="18" fill="#925113"><tspan x="340" dy="0">Modulo: id % 2 → id % 4</tspan></text>
<rect data-rg-kind="shape" x="20" y="335" width="160" height="55" fill="#fbeee2" stroke="#ca6f1e" stroke-width="1"/>
<text x="100.0" y="368.5" text-anchor="middle" font-size="18" fill="#925113"><tspan x="100.0" dy="0">Old shard</tspan></text>
<rect data-rg-kind="shape" x="180" y="335" width="240" height="55" fill="#fbeee2" stroke="#ca6f1e" stroke-width="1"/>
<text x="300.0" y="368.5" text-anchor="middle" font-size="18" fill="#925113"><tspan x="300.0" dy="0">Stays here</tspan></text>
<rect data-rg-kind="shape" x="420" y="335" width="240" height="55" fill="#fbeee2" stroke="#ca6f1e" stroke-width="1"/>
<text x="540.0" y="368.5" text-anchor="middle" font-size="18" fill="#925113"><tspan x="540.0" dy="0">Must move</tspan></text>
<rect data-rg-kind="shape" x="20" y="390" width="160" height="55" fill="#ffffff" stroke="#ca6f1e" stroke-width="1"/>
<text x="100.0" y="423.5" text-anchor="middle" font-size="18" fill="#925113"><tspan x="100.0" dy="0">0: 0,2,4,6</tspan></text>
<rect data-rg-kind="shape" x="180" y="390" width="240" height="55" fill="#ffffff" stroke="#ca6f1e" stroke-width="1"/>
<text x="300.0" y="423.5" text-anchor="middle" font-size="18" fill="#925113"><tspan x="300.0" dy="0">0,4 → shard 0</tspan></text>
<rect data-rg-kind="shape" x="420" y="390" width="240" height="55" fill="#ffffff" stroke="#ca6f1e" stroke-width="1"/>
<text x="540.0" y="423.5" text-anchor="middle" font-size="18" fill="#925113"><tspan x="540.0" dy="0">2,6 → shard 2</tspan></text>
<rect data-rg-kind="shape" x="20" y="445" width="160" height="55" fill="#ffffff" stroke="#ca6f1e" stroke-width="1"/>
<text x="100.0" y="478.5" text-anchor="middle" font-size="18" fill="#925113"><tspan x="100.0" dy="0">1: 1,3,5,7</tspan></text>
<rect data-rg-kind="shape" x="180" y="445" width="240" height="55" fill="#ffffff" stroke="#ca6f1e" stroke-width="1"/>
<text x="300.0" y="478.5" text-anchor="middle" font-size="18" fill="#925113"><tspan x="300.0" dy="0">1,5 → shard 1</tspan></text>
<rect data-rg-kind="shape" x="420" y="445" width="240" height="55" fill="#ffffff" stroke="#ca6f1e" stroke-width="1"/>
<text x="540.0" y="478.5" text-anchor="middle" font-size="18" fill="#925113"><tspan x="540.0" dy="0">3,7 → shard 3</tspan></text>
<text x="340" y="530" text-anchor="middle" font-size="18" fill="#383a42"><tspan x="340" dy="0">New destinations</tspan></text>
<rect data-rg-kind="shape" data-rg-role="blue" x="20" y="565" width="145" height="56" rx="8" fill="#e6efff" stroke="#4078f2" stroke-width="1.5"/>
<text x="92.5" y="599.0" text-anchor="middle" font-size="18" fill="#1a52cf"><tspan x="92.5" dy="0">S0: 0,4</tspan></text>
<rect data-rg-kind="shape" data-rg-role="blue" x="185" y="565" width="145" height="56" rx="8" fill="#e6efff" stroke="#4078f2" stroke-width="1.5"/>
<text x="257.5" y="599.0" text-anchor="middle" font-size="18" fill="#1a52cf"><tspan x="257.5" dy="0">S1: 1,5</tspan></text>
<rect data-rg-kind="shape" data-rg-role="purple" x="350" y="565" width="145" height="56" rx="8" fill="#faecf9" stroke="#a626a4" stroke-width="1.5"/>
<text x="422.5" y="599.0" text-anchor="middle" font-size="18" fill="#771977"><tspan x="422.5" dy="0">S2: 2,6</tspan></text>
<rect data-rg-kind="shape" data-rg-role="purple" x="515" y="565" width="145" height="56" rx="8" fill="#faecf9" stroke="#a626a4" stroke-width="1.5"/>
<text x="587.5" y="599.0" text-anchor="middle" font-size="18" fill="#771977"><tspan x="587.5" dy="0">S3: 3,7</tspan></text>
<text x="340" y="675" text-anchor="middle" font-size="18" fill="#383a42"><tspan x="340" dy="0">Changing the formula alone does not move existing rows</tspan></text></g></svg>
