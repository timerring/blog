<svg xmlns="http://www.w3.org/2000/svg" id="finance-four-positions" class="svg-canvas logic2image" width="100%" viewBox="0 0 1200 900" role="img" aria-labelledby="finance-four-positions-title" aria-describedby="finance-four-positions-desc" style="display:block;margin-inline:auto;min-width:480px;max-width:568px">
  <title id="finance-four-positions-title">Each contract has two sides</title>
  <desc id="finance-four-positions-desc">Premium travels from buyer to seller. Call buyers have the right to buy; call sellers must sell if assigned. Put buyers have the right to sell; put sellers must buy if assigned. Selling means selling to open; asset trades use strike price.</desc>
  <defs>
    <style>
#finance-four-positions text { font-family: Georgia, serif; font-weight:400; font-size:35.915493px; fill:var(--rg-ink,#383a42); }
#finance-four-positions .rg-title { font-size:46.690141px; }
#finance-four-positions .rg-support { font-size:32.323944px; fill:var(--rg-support,#696c77); }
#finance-four-positions .rg-shape { fill:var(--rg-fill); stroke:var(--rg-stroke); stroke-width:2.625000; }
#finance-four-positions [data-rg-role="purple"] { --rg-fill:#faecf9; --rg-stroke:#a626a4; --rg-ink:#771977; --rg-support:#a626a4; }
#finance-four-positions [data-rg-role="teal"] { --rg-fill:#e1f3fa; --rg-stroke:#0184bc; --rg-ink:#015f88; --rg-support:#0184bc; }
#finance-four-positions [data-rg-role="coral"] { --rg-fill:#fbeee2; --rg-stroke:#ca6f1e; --rg-ink:#925113; --rg-support:#ca6f1e; }
#finance-four-positions [data-rg-role="pink"] { --rg-fill:#fce8ee; --rg-stroke:#b83260; --rg-ink:#852344; --rg-support:#b83260; }
#finance-four-positions [data-rg-role="gray"] { --rg-fill:#f0f0f1; --rg-stroke:#5c5e66; --rg-ink:#383a42; --rg-support:#5c5e66; }
#finance-four-positions [data-rg-role="blue"] { --rg-fill:#e6efff; --rg-stroke:#4078f2; --rg-ink:#1a52cf; --rg-support:#4078f2; }
#finance-four-positions [data-rg-role="green"] { --rg-fill:#e8f3e2; --rg-stroke:#50a14f; --rg-ink:#3a7639; --rg-support:#50a14f; }
#finance-four-positions [data-rg-role="amber"] { --rg-fill:#fbeed8; --rg-stroke:#c18401; --rg-ink:#8c6001; --rg-support:#c18401; }
#finance-four-positions [data-rg-role="red"] { --rg-fill:#fde8e6; --rg-stroke:#e45649; --rg-ink:#a83329; --rg-support:#e45649; }
</style>
    <filter id="finance-four-positions-sketch" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="turbulence" baseFrequency="0.03" numOctaves="4" seed="2" result="noise" />
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="2.5" xChannelSelector="R" yChannelSelector="G" />
    </filter>
    <marker id="finance-four-positions-arrow" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="10" markerHeight="10" orient="auto-start-reverse">
      <path d="M2 3L10 6L2 9Z" fill="context-stroke" />
    </marker>
  </defs>
  <rect width="1200" height="900" fill="#ffffff" />
  <text class="rg-title" data-rg-title="true" x="600.0" y="80" text-anchor="middle">Each contract has two sides</text>
  <g data-rg-content="true">
    
  <g data-rg-role="teal"><text x="320" y="170" text-anchor="middle">BUY · pay premium</text></g><g data-rg-role="purple"><text x="880" y="170" text-anchor="middle">SELL TO OPEN</text></g><text x="600" y="230" text-anchor="middle" class="rg-support">Premium</text><path d="M440 255H760" fill="none" stroke="#5c5e66" stroke-width="3" data-rg-kind="connector" data-rg-name="premium-payment" marker-end="url(#finance-four-positions-arrow)" /><text x="80" y="320" text-anchor="start">CALL</text><g data-rg-node="Long call" data-rg-role="teal"><rect x="80" y="350" width="480" height="180" rx="8" data-rg-kind="shape" class="rg-shape" filter="url(#finance-four-positions-sketch)" /><text x="320" y="400" text-anchor="middle">Long call</text><text x="320" y="455" text-anchor="middle">Right to buy</text><text x="320" y="505" text-anchor="middle" class="rg-support">Choice, not obligation</text></g><g data-rg-node="Short call" data-rg-role="purple"><rect x="640" y="350" width="480" height="180" rx="8" data-rg-kind="shape" class="rg-shape" filter="url(#finance-four-positions-sketch)" /><text x="880" y="400" text-anchor="middle">Short call</text><text x="880" y="455" text-anchor="middle">Must sell</text><text x="880" y="505" text-anchor="middle" class="rg-support">if assigned</text></g><text x="80" y="580" text-anchor="start">PUT</text><g data-rg-node="Long put" data-rg-role="teal"><rect x="80" y="610" width="480" height="180" rx="8" data-rg-kind="shape" class="rg-shape" filter="url(#finance-four-positions-sketch)" /><text x="320" y="660" text-anchor="middle">Long put</text><text x="320" y="715" text-anchor="middle">Right to sell</text><text x="320" y="765" text-anchor="middle" class="rg-support">Choice, not obligation</text></g><g data-rg-node="Short put" data-rg-role="purple"><rect x="640" y="610" width="480" height="180" rx="8" data-rg-kind="shape" class="rg-shape" filter="url(#finance-four-positions-sketch)" /><text x="880" y="660" text-anchor="middle">Short put</text><text x="880" y="715" text-anchor="middle">Must buy</text><text x="880" y="765" text-anchor="middle" class="rg-support">if assigned</text></g><text x="600" y="865" text-anchor="middle" class="rg-support">All asset trades occur at the strike price</text></g>
</svg>
