<svg xmlns="http://www.w3.org/2000/svg" id="kafka-after" class="logic2image" role="img" aria-labelledby="kafka-after-title" aria-describedby="kafka-after-desc" viewBox="0 0 680 845" width="680" height="845" style="max-width:100%;height:auto"><title id="kafka-after-title">Kafka: each partition has leader and follower copies</title><desc id="kafka-after-desc">Topic has P1/P2/P3 on separate brokers. Five brokers: leaders on brokers 1/2/3, P1 follower on broker 4, P2 and P3 followers share broker 5. Eligible replicas enable failover. A consumer fetches from the partition leaders.</desc><style>#kafka-after text {font-family: Georgia, serif;}</style><defs><marker id="kafka-after-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9 z" fill="context-stroke"/></marker></defs><rect width="680" height="845" fill="#ffffff"/><g data-rg-content="true"><text x="340" y="36" text-anchor="middle" font-size="23" fill="#383a42" data-rg-title="true"><tspan x="340" dy="0">Kafka: each partition has leader and follower copies</tspan></text>
<rect data-rg-kind="shape" data-rg-role="teal" x="245" y="75" width="190" height="56" rx="8" fill="#e1f3fa" stroke="#0184bc" stroke-width="1.5"/>
<text x="340.0" y="109.0" text-anchor="middle" font-size="18" fill="#015f88"><tspan x="340.0" dy="0">Producer</tspan></text>
<path data-rg-kind="guide" d="M340,131 V155 M105,155 H555" fill="none" stroke="#0184bc" stroke-width="2"/>
<rect data-rg-kind="shape" x="10" y="465" width="190" height="140" rx="10" fill="#ffffff" stroke="#5c5e66" stroke-width="1.5" stroke-dasharray="6 4"/>
<rect data-rg-kind="shape" x="235" y="465" width="415" height="140" rx="10" fill="#ffffff" stroke="#5c5e66" stroke-width="1.5" stroke-dasharray="6 4"/>
<text x="25" y="587" text-anchor="start" font-size="18" fill="#383a42"><tspan x="25" dy="0">Broker 4</tspan></text>
<text x="250" y="587" text-anchor="start" font-size="18" fill="#383a42"><tspan x="250" dy="0">Broker 5</tspan></text>
<rect data-rg-kind="shape" x="10" y="225" width="190" height="140" rx="10" fill="#ffffff" stroke="#5c5e66" stroke-width="1.5" stroke-dasharray="6 4"/>
<text x="25" y="347" text-anchor="start" font-size="18" fill="#383a42"><tspan x="25" dy="0">Broker 1</tspan></text>
<polyline data-rg-kind="connector" points="105,155 105,240" fill="none" stroke="#0184bc" stroke-width="2" marker-end="url(#kafka-after-arrow)"/>
<rect data-rg-kind="shape" data-rg-role="coral" x="25" y="240" width="160" height="65" rx="8" fill="#fbeee2" stroke="#ca6f1e" stroke-width="1.5"/>
<text x="105.0" y="266.5" text-anchor="middle" font-size="18" fill="#925113"><tspan x="105.0" dy="0">P1: leader</tspan><tspan x="105.0" dy="24">records for P1</tspan></text>
<polyline data-rg-kind="connector" points="170,305 170,480" fill="none" stroke="#4078f2" stroke-width="2" marker-end="url(#kafka-after-arrow)"/>
<text x="105" y="407" text-anchor="middle" font-size="18" fill="#1a52cf"><tspan x="105" dy="0">Copy P1</tspan></text>
<rect data-rg-kind="shape" data-rg-role="blue" x="25" y="480" width="160" height="65" rx="8" fill="#e6efff" stroke="#4078f2" stroke-width="1.5"/>
<text x="105.0" y="506.5" text-anchor="middle" font-size="18" fill="#1a52cf"><tspan x="105.0" dy="0">P1: follower</tspan><tspan x="105.0" dy="24">same P1 log</tspan></text>
<rect data-rg-kind="shape" x="235" y="225" width="190" height="140" rx="10" fill="#ffffff" stroke="#5c5e66" stroke-width="1.5" stroke-dasharray="6 4"/>
<text x="250" y="347" text-anchor="start" font-size="18" fill="#383a42"><tspan x="250" dy="0">Broker 2</tspan></text>
<polyline data-rg-kind="connector" points="330,155 330,240" fill="none" stroke="#0184bc" stroke-width="2" marker-end="url(#kafka-after-arrow)"/>
<rect data-rg-kind="shape" data-rg-role="coral" x="250" y="240" width="160" height="65" rx="8" fill="#fbeee2" stroke="#ca6f1e" stroke-width="1.5"/>
<text x="330.0" y="266.5" text-anchor="middle" font-size="18" fill="#925113"><tspan x="330.0" dy="0">P2: leader</tspan><tspan x="330.0" dy="24">records for P2</tspan></text>
<polyline data-rg-kind="connector" points="395,305 395,480" fill="none" stroke="#4078f2" stroke-width="2" marker-end="url(#kafka-after-arrow)"/>
<text x="330" y="407" text-anchor="middle" font-size="18" fill="#1a52cf"><tspan x="330" dy="0">Copy P2</tspan></text>
<rect data-rg-kind="shape" data-rg-role="blue" x="250" y="480" width="160" height="65" rx="8" fill="#e6efff" stroke="#4078f2" stroke-width="1.5"/>
<text x="330.0" y="506.5" text-anchor="middle" font-size="18" fill="#1a52cf"><tspan x="330.0" dy="0">P2: follower</tspan><tspan x="330.0" dy="24">same P2 log</tspan></text>
<rect data-rg-kind="shape" x="460" y="225" width="190" height="140" rx="10" fill="#ffffff" stroke="#5c5e66" stroke-width="1.5" stroke-dasharray="6 4"/>
<text x="475" y="347" text-anchor="start" font-size="18" fill="#383a42"><tspan x="475" dy="0">Broker 3</tspan></text>
<polyline data-rg-kind="connector" points="555,155 555,240" fill="none" stroke="#0184bc" stroke-width="2" marker-end="url(#kafka-after-arrow)"/>
<rect data-rg-kind="shape" data-rg-role="coral" x="475" y="240" width="160" height="65" rx="8" fill="#fbeee2" stroke="#ca6f1e" stroke-width="1.5"/>
<text x="555.0" y="266.5" text-anchor="middle" font-size="18" fill="#925113"><tspan x="555.0" dy="0">P3: leader</tspan><tspan x="555.0" dy="24">records for P3</tspan></text>
<polyline data-rg-kind="connector" points="620,305 620,480" fill="none" stroke="#4078f2" stroke-width="2" marker-end="url(#kafka-after-arrow)"/>
<text x="555" y="407" text-anchor="middle" font-size="18" fill="#1a52cf"><tspan x="555" dy="0">Copy P3</tspan></text>
<rect data-rg-kind="shape" data-rg-role="blue" x="475" y="480" width="160" height="65" rx="8" fill="#e6efff" stroke="#4078f2" stroke-width="1.5"/>
<text x="555.0" y="506.5" text-anchor="middle" font-size="18" fill="#1a52cf"><tspan x="555.0" dy="0">P3: follower</tspan><tspan x="555.0" dy="24">same P3 log</tspan></text>
<text x="340" y="800" text-anchor="middle" font-size="18" fill="#383a42"><tspan x="340" dy="0">Leader failure → eligible replica can take over</tspan></text>
<rect data-rg-kind="shape" data-rg-role="purple" x="245" y="680" width="190" height="56" rx="8" fill="#faecf9" stroke="#a626a4" stroke-width="1.5"/>
<text x="340.0" y="714.0" text-anchor="middle" font-size="18" fill="#771977"><tspan x="340.0" dy="0">Consumer</tspan></text>
<text x="340" y="770" text-anchor="middle" font-size="18" fill="#771977"><tspan x="340" dy="0">Fetch requests → leaders, not followers</tspan></text>
<path data-rg-kind="guide" d="M340,680 V655 H215 M340,655 H670" fill="none" stroke="#a626a4" stroke-width="2"/>
<path data-rg-kind="connector" data-rg-route="bezier" data-line-meaning="consumer fetch request to this partition leader" d="M215,655 C215,530 215,272.5 185,272.5" fill="none" stroke="#a626a4" stroke-width="2" marker-end="url(#kafka-after-arrow)"/>
<path data-rg-kind="connector" data-rg-route="bezier" data-line-meaning="consumer fetch request to this partition leader" d="M230,655 C230,530 230,272.5 250,272.5" fill="none" stroke="#a626a4" stroke-width="2" marker-end="url(#kafka-after-arrow)"/>
<path data-rg-kind="connector" data-rg-route="bezier" data-line-meaning="consumer fetch request to this partition leader" d="M670,655 C670,530 670,272.5 635,272.5" fill="none" stroke="#a626a4" stroke-width="2" marker-end="url(#kafka-after-arrow)"/>
<text x="340" y="830" text-anchor="middle" font-size="18" fill="#383a42"><tspan x="340" dy="0">Failover eligibility depends on ISR and configuration</tspan></text></g></svg>
