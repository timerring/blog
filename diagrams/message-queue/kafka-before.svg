<svg xmlns="http://www.w3.org/2000/svg" id="kafka-before" class="logic2image" role="img" aria-labelledby="kafka-before-title" aria-describedby="kafka-before-desc" viewBox="0 0 680 430" width="680" height="430" style="max-width:100%;height:auto"><title id="kafka-before-title">Partitioning alone does not provide failover</title><desc id="kafka-before-desc">Topic has P1/P2/P3 on separate brokers. One copy per partition: broker failure makes its partition unavailable.</desc><style>#kafka-before text {font-family: Georgia, serif;}</style><defs><marker id="kafka-before-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9 z" fill="context-stroke"/></marker></defs><rect width="680" height="430" fill="#ffffff"/><g data-rg-content="true"><text x="340" y="36" text-anchor="middle" font-size="23" fill="#383a42" data-rg-title="true"><tspan x="340" dy="0">Partitioning alone does not provide failover</tspan></text>
<rect data-rg-kind="shape" data-rg-role="teal" x="245" y="75" width="190" height="56" rx="8" fill="#e1f3fa" stroke="#0184bc" stroke-width="1.5"/>
<text x="340.0" y="109.0" text-anchor="middle" font-size="18" fill="#015f88"><tspan x="340.0" dy="0">Producer</tspan></text>
<path data-rg-kind="guide" d="M340,131 V155 M105,155 H555" fill="none" stroke="#0184bc" stroke-width="2"/>
<rect data-rg-kind="shape" x="10" y="225" width="190" height="140" rx="10" fill="#ffffff" stroke="#5c5e66" stroke-width="1.5" stroke-dasharray="6 4"/>
<text x="25" y="347" text-anchor="start" font-size="18" fill="#383a42"><tspan x="25" dy="0">Broker 1</tspan></text>
<polyline data-rg-kind="connector" points="105,155 105,240" fill="none" stroke="#0184bc" stroke-width="2" marker-end="url(#kafka-before-arrow)"/>
<rect data-rg-kind="shape" data-rg-role="coral" x="25" y="240" width="160" height="65" rx="8" fill="#fbeee2" stroke="#ca6f1e" stroke-width="1.5"/>
<text x="105.0" y="266.5" text-anchor="middle" font-size="18" fill="#925113"><tspan x="105.0" dy="0">P1: leader</tspan><tspan x="105.0" dy="24">records for P1</tspan></text>
<rect data-rg-kind="shape" x="235" y="225" width="190" height="140" rx="10" fill="#ffffff" stroke="#5c5e66" stroke-width="1.5" stroke-dasharray="6 4"/>
<text x="250" y="347" text-anchor="start" font-size="18" fill="#383a42"><tspan x="250" dy="0">Broker 2</tspan></text>
<polyline data-rg-kind="connector" points="330,155 330,240" fill="none" stroke="#0184bc" stroke-width="2" marker-end="url(#kafka-before-arrow)"/>
<rect data-rg-kind="shape" data-rg-role="coral" x="250" y="240" width="160" height="65" rx="8" fill="#fbeee2" stroke="#ca6f1e" stroke-width="1.5"/>
<text x="330.0" y="266.5" text-anchor="middle" font-size="18" fill="#925113"><tspan x="330.0" dy="0">P2: leader</tspan><tspan x="330.0" dy="24">records for P2</tspan></text>
<rect data-rg-kind="shape" x="460" y="225" width="190" height="140" rx="10" fill="#ffffff" stroke="#5c5e66" stroke-width="1.5" stroke-dasharray="6 4"/>
<text x="475" y="347" text-anchor="start" font-size="18" fill="#383a42"><tspan x="475" dy="0">Broker 3</tspan></text>
<polyline data-rg-kind="connector" points="555,155 555,240" fill="none" stroke="#0184bc" stroke-width="2" marker-end="url(#kafka-before-arrow)"/>
<rect data-rg-kind="shape" data-rg-role="coral" x="475" y="240" width="160" height="65" rx="8" fill="#fbeee2" stroke="#ca6f1e" stroke-width="1.5"/>
<text x="555.0" y="266.5" text-anchor="middle" font-size="18" fill="#925113"><tspan x="555.0" dy="0">P3: leader</tspan><tspan x="555.0" dy="24">records for P3</tspan></text>
<text x="340" y="405" text-anchor="middle" font-size="18" fill="#383a42"><tspan x="340" dy="0">Broker 2 down → P2 unavailable; P1 / P3 are separate</tspan></text></g></svg>
