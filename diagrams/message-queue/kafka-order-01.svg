<text x="570.0" y="581.5" text-anchor="middle" font-size="18" fill="#771977"><tspan x="570.0" dy="0">Thread 3</tspan><tspan x="570.0" dy="24">data3</tspan></text>
<polyline data-rg-kind="guide" points="570,625 570,650" fill="none" stroke="#5c5e66" stroke-width="1.5"/>
<polyline data-rg-kind="guide" points="110,650 570,650" fill="none" stroke="#5c5e66" stroke-width="1.5"/>
<polyline data-rg-kind="connector" points="340,650 340,680" fill="none" stroke="#a626a4" stroke-width="2" marker-end="url(#kafka-order-01-arrow)"/>
<rect data-rg-kind="shape" data-rg-role="red" x="125" y="680" width="430" height="56" rx="8" fill="#fde8e6" stroke="#e45649" stroke-width="1.5"/>
<text x="340.0" y="714.0" text-anchor="middle" font-size="18" fill="#a83329"><tspan x="340.0" dy="0">Database: data3 → data1 → data2</tspan></text>
<text x="340" y="758" text-anchor="middle" font-size="18" fill="#383a42"><tspan x="340" dy="0">One possible completion order, not a Kafka delivery order</tspan></text></g></svg>
