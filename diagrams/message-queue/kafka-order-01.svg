<svg xmlns="http://www.w3.org/2000/svg" id="kafka-order-01" class="logic2image" role="img" aria-labelledby="kafka-order-01-title" aria-describedby="kafka-order-01-desc" viewBox="0 0 680 770" width="680" height="770" style="max-width:100%;height:auto"><title id="kafka-order-01-title">Kafka: a thread pool can reorder one partition</title><desc id="kafka-order-01-desc">Same-key events enter P1, consumer reads in order. Dispatch to different threads; completion can be data3/data1/data2.</desc><style>#kafka-order-01 text {font-family: Georgia, serif;}</style><defs><marker id="kafka-order-01-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9 z" fill="context-stroke"/></marker></defs><rect width="680" height="770" fill="#ffffff"/><g data-rg-content="true"><text x="340" y="36" text-anchor="middle" font-size="23" fill="#383a42" data-rg-title="true"><tspan x="340" dy="0">Kafka: a thread pool can reorder one partition</tspan></text>
<rect data-rg-kind="shape" data-rg-role="teal" x="245" y="70" width="190" height="56" rx="8" fill="#e1f3fa" stroke="#0184bc" stroke-width="1.5"/>
<text x="340.0" y="104.0" text-anchor="middle" font-size="18" fill="#015f88"><tspan x="340.0" dy="0">Producer</tspan></text>
<text x="340" y="210" text-anchor="middle" font-size="18" fill="#383a42"><tspan x="340" dy="0">Same key → P1: data1 → data2 → data3</tspan></text>
<polyline data-rg-kind="connector" points="340,126 340,170 110,170 110,225" fill="none" stroke="#0184bc" stroke-width="2" marker-end="url(#kafka-order-01-arrow)"/>
<rect data-rg-kind="shape" data-rg-role="coral" x="25" y="225" width="170" height="56" rx="8" fill="#fbeee2" stroke="#ca6f1e" stroke-width="1.5"/>
<text x="110.0" y="259.0" text-anchor="middle" font-size="18" fill="#925113"><tspan x="110.0" dy="0">Partition 1</tspan></text>
<polyline data-rg-kind="connector" points="110,281 110,340" fill="none" stroke="#ca6f1e" stroke-width="2" marker-end="url(#kafka-order-01-arrow)"/>
<rect data-rg-kind="shape" data-rg-role="purple" x="25" y="340" width="170" height="56" rx="8" fill="#faecf9" stroke="#a626a4" stroke-width="1.5"/>
<text x="110.0" y="374.0" text-anchor="middle" font-size="18" fill="#771977"><tspan x="110.0" dy="0">Consumer 1</tspan></text>
<rect data-rg-kind="shape" data-rg-role="coral" x="255" y="225" width="170" height="56" rx="8" fill="#fbeee2" stroke="#ca6f1e" stroke-width="1.5"/>
<text x="340.0" y="259.0" text-anchor="middle" font-size="18" fill="#925113"><tspan x="340.0" dy="0">Partition 2</tspan></text>
<polyline data-rg-kind="connector" points="340,281 340,340" fill="none" stroke="#ca6f1e" stroke-width="2" marker-end="url(#kafka-order-01-arrow)"/>
<rect data-rg-kind="shape" data-rg-role="purple" x="255" y="340" width="170" height="56" rx="8" fill="#faecf9" stroke="#a626a4" stroke-width="1.5"/>
<text x="340.0" y="374.0" text-anchor="middle" font-size="18" fill="#771977"><tspan x="340.0" dy="0">Consumer 2</tspan></text>
<rect data-rg-kind="shape" data-rg-role="coral" x="485" y="225" width="170" height="56" rx="8" fill="#fbeee2" stroke="#ca6f1e" stroke-width="1.5"/>
<text x="570.0" y="259.0" text-anchor="middle" font-size="18" fill="#925113"><tspan x="570.0" dy="0">Partition 3</tspan></text>
<polyline data-rg-kind="connector" points="570,281 570,340" fill="none" stroke="#ca6f1e" stroke-width="2" marker-end="url(#kafka-order-01-arrow)"/>
<rect data-rg-kind="shape" data-rg-role="purple" x="485" y="340" width="170" height="56" rx="8" fill="#faecf9" stroke="#a626a4" stroke-width="1.5"/>
<text x="570.0" y="374.0" text-anchor="middle" font-size="18" fill="#771977"><tspan x="570.0" dy="0">Consumer 3</tspan></text>
<text x="340" y="445" text-anchor="middle" font-size="18" fill="#383a42"><tspan x="340" dy="0">Detail inside consumer 1 (P1 is read in order)</tspan></text>
<polyline data-rg-kind="guide" points="110,396 110,420 15,420 15,470 570,470" fill="none" stroke="#5c5e66" stroke-width="1.5"/>
