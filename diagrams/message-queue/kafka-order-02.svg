<polyline data-rg-kind="connector" points="340,625 340,670" fill="none" stroke="#c18401" stroke-width="2" marker-end="url(#kafka-order-02-arrow)"/>
<rect data-rg-kind="shape" data-rg-role="purple" x="255" y="670" width="170" height="56" rx="8" fill="#faecf9" stroke="#a626a4" stroke-width="1.5"/>
<text x="340.0" y="704.0" text-anchor="middle" font-size="18" fill="#771977"><tspan x="340.0" dy="0">Serial worker 2</tspan></text>
<rect data-rg-kind="shape" data-rg-role="amber" x="485" y="545" width="170" height="80" rx="8" fill="#fbeed8" stroke="#c18401" stroke-width="1.5"/>
<text x="570.0" y="579.0" text-anchor="middle" font-size="18" fill="#8c6001"><tspan x="570.0" dy="0">Memory queue 3</tspan><tspan x="570.0" dy="24">other keys</tspan></text>
<polyline data-rg-kind="connector" points="570,625 570,670" fill="none" stroke="#c18401" stroke-width="2" marker-end="url(#kafka-order-02-arrow)"/>
<rect data-rg-kind="shape" data-rg-role="purple" x="485" y="670" width="170" height="56" rx="8" fill="#faecf9" stroke="#a626a4" stroke-width="1.5"/>
<text x="570.0" y="704.0" text-anchor="middle" font-size="18" fill="#771977"><tspan x="570.0" dy="0">Serial worker 3</tspan></text>
<text x="340" y="770" text-anchor="middle" font-size="18" fill="#383a42"><tspan x="340" dy="0">Same-key tasks stay with worker 1</tspan></text>
<polyline data-rg-kind="connector" points="110,726 110,790 340,790 340,815" fill="none" stroke="#a626a4" stroke-width="2" marker-end="url(#kafka-order-02-arrow)"/>
<rect data-rg-kind="shape" data-rg-role="green" x="125" y="815" width="430" height="56" rx="8" fill="#e8f3e2" stroke="#50a14f" stroke-width="1.5"/>
<text x="340.0" y="849.0" text-anchor="middle" font-size="18" fill="#3a7639"><tspan x="340.0" dy="0">Database: data1 → data2 → data3</tspan></text></g></svg>
