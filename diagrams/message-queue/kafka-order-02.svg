<svg xmlns="http://www.w3.org/2000/svg" id="kafka-order-02" class="logic2image" role="img" aria-labelledby="kafka-order-02-title" aria-describedby="kafka-order-02-desc" viewBox="0 0 680 880" width="680" height="880" style="max-width:100%;height:auto"><title id="kafka-order-02-title">Kafka: keyed worker queues preserve local order</title><desc id="kafka-order-02-desc">Same-key events enter P1, consumer reads in order. Hash to memory queue 1 and its serial worker.</desc><style>#kafka-order-02 text {font-family: Georgia, serif;}</style><defs><marker id="kafka-order-02-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9 z" fill="context-stroke"/></marker></defs><rect width="680" height="880" fill="#ffffff"/><g data-rg-content="true"><text x="340" y="36" text-anchor="middle" font-size="23" fill="#383a42" data-rg-title="true"><tspan x="340" dy="0">Kafka: keyed worker queues preserve local order</tspan></text>
<rect data-rg-kind="shape" data-rg-role="teal" x="245" y="70" width="190" height="56" rx="8" fill="#e1f3fa" stroke="#0184bc" stroke-width="1.5"/>
<text x="340.0" y="104.0" text-anchor="middle" font-size="18" fill="#015f88"><tspan x="340.0" dy="0">Producer</tspan></text>
<text x="340" y="210" text-anchor="middle" font-size="18" fill="#383a42"><tspan x="340" dy="0">Same key → P1: data1 → data2 → data3</tspan></text>
<polyline data-rg-kind="connector" points="340,126 340,170 110,170 110,225" fill="none" stroke="#0184bc" stroke-width="2" marker-end="url(#kafka-order-02-arrow)"/>
