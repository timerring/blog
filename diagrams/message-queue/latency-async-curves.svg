<svg xmlns="http://www.w3.org/2000/svg" id="latency-async-curves" class="logic2image" role="img" aria-labelledby="latency-async-curves-title" aria-describedby="latency-async-curves-desc" viewBox="0 0 680 590" width="680" height="590" style="max-width:100%;height:auto"><title id="latency-async-curves-title">Async: return without waiting for downstream</title><desc id="latency-async-curves-desc">A writes locally in 3 ms and calls B/C/D taking 300/450/200 ms. MQ publication takes 5 ms total. The curved return takes the response to the client after 8 ms; dashed paths are independent background work.</desc><style>#latency-async-curves text {font-family: Georgia, serif;}</style><defs><marker id="latency-async-curves-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9 z" fill="context-stroke"/></marker></defs><rect width="680" height="590" fill="#ffffff"/><g data-rg-content="true"><text x="340" y="36" text-anchor="middle" font-size="23" fill="#383a42" data-rg-title="true"><tspan x="340" dy="0">Async: return without waiting for downstream</tspan></text>
<rect data-rg-kind="shape" x="12" y="85" width="656" height="420" rx="14" fill="#ffffff" stroke="#5c5e66" stroke-width="1"/>
<text x="340" y="125" text-anchor="middle" font-size="18" fill="#3a7639"><tspan x="340" dy="0">ASYNCHRONOUS — 8 ms response</tspan></text>
<rect data-rg-kind="shape" data-rg-role="teal" x="20" y="190" width="80" height="75" rx="8" fill="#e1f3fa" stroke="#0184bc" stroke-width="1.5"/>
<text x="60.0" y="233.5" text-anchor="middle" font-size="18" fill="#015f88"><tspan x="60.0" dy="0">User</tspan></text>
<rect data-rg-kind="shape" data-rg-role="teal" x="135" y="190" width="110" height="75" rx="8" fill="#e1f3fa" stroke="#0184bc" stroke-width="1.5"/>
<text x="190.0" y="221.5" text-anchor="middle" font-size="18" fill="#015f88"><tspan x="190.0" dy="0">A: DB write</tspan><tspan x="190.0" dy="24">3 ms</tspan></text>
<polyline data-rg-kind="connector" points="100,227.5 133,227.5" fill="none" stroke="#0184bc" stroke-width="2" marker-end="url(#latency-async-curves-arrow)"/>
<polyline data-rg-kind="connector" points="245,227.5 278,227.5" fill="none" stroke="#0184bc" stroke-width="2" marker-end="url(#latency-async-curves-arrow)"/>
<rect data-rg-kind="shape" data-rg-role="coral" x="280" y="190" width="140" height="75" rx="8" fill="#fbeee2" stroke="#ca6f1e" stroke-width="1.5"/>
<text x="350.0" y="221.5" text-anchor="middle" font-size="18" fill="#925113"><tspan x="350.0" dy="0">Publish to MQ</tspan><tspan x="350.0" dy="24">5 ms total</tspan></text>
<path data-rg-kind="connector" data-rg-route="bezier" data-line-meaning="response after local write and publication" d="M350,265 C350,342 60,342 60,267" fill="none" stroke="#50a14f" stroke-width="2" marker-end="url(#latency-async-curves-arrow)"/>
<text x="205" y="365" text-anchor="middle" font-size="18" fill="#3a7639"><tspan x="205" dy="0">Fast response: 3 + 5 = 8 ms</tspan></text>
<path data-rg-kind="connector" data-rg-route="bezier" data-line-meaning="background consumption, not delivery failure" d="M420,210 C450,210 450,195 478,195" fill="none" stroke="#a626a4" stroke-width="2" marker-end="url(#latency-async-curves-arrow)" stroke-dasharray="6 4"/>
<rect data-rg-kind="shape" data-rg-role="purple" x="480" y="160" width="180" height="70" rx="8" fill="#faecf9" stroke="#a626a4" stroke-width="1.5"/>
<text x="570.0" y="189.0" text-anchor="middle" font-size="18" fill="#771977"><tspan x="570.0" dy="0">Queue B → B</tspan><tspan x="570.0" dy="24">300 ms</tspan></text>
<path data-rg-kind="connector" data-rg-route="bezier" data-line-meaning="background consumption, not delivery failure" d="M420,227.5 C450,227.5 450,290 478,290" fill="none" stroke="#a626a4" stroke-width="2" marker-end="url(#latency-async-curves-arrow)" stroke-dasharray="6 4"/>
<rect data-rg-kind="shape" data-rg-role="purple" x="480" y="255" width="180" height="70" rx="8" fill="#faecf9" stroke="#a626a4" stroke-width="1.5"/>
<text x="570.0" y="284.0" text-anchor="middle" font-size="18" fill="#771977"><tspan x="570.0" dy="0">Queue C → C</tspan><tspan x="570.0" dy="24">450 ms</tspan></text>
<path data-rg-kind="connector" data-rg-route="bezier" data-line-meaning="background consumption, not delivery failure" d="M420,245 C450,245 450,385 478,385" fill="none" stroke="#a626a4" stroke-width="2" marker-end="url(#latency-async-curves-arrow)" stroke-dasharray="6 4"/>
<rect data-rg-kind="shape" data-rg-role="purple" x="480" y="350" width="180" height="70" rx="8" fill="#faecf9" stroke="#a626a4" stroke-width="1.5"/>
<text x="570.0" y="379.0" text-anchor="middle" font-size="18" fill="#771977"><tspan x="570.0" dy="0">Queue D → D</tspan><tspan x="570.0" dy="24">200 ms</tspan></text>
<text x="340" y="475" text-anchor="middle" font-size="18" fill="#383a42"><tspan x="340" dy="0">B / C / D each has an independent queue</tspan></text>
<text x="340" y="550" text-anchor="middle" font-size="18" fill="#383a42"><tspan x="340" dy="0">Dashed routes: background work, not failed delivery</tspan></text></g></svg>
