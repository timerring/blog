<svg xmlns="http://www.w3.org/2000/svg" id="latency-sync-curves" class="logic2image" role="img" aria-labelledby="latency-sync-curves-title" aria-describedby="latency-sync-curves-desc" viewBox="0 0 680 440" width="680" height="440" style="max-width:100%;height:auto"><title id="latency-sync-curves-title">Sync: the client waits for every serial call</title><desc id="latency-sync-curves-desc">A writes locally in 3 ms and calls B/C/D taking 300/450/200 ms. A performs the calls serially. The curved return starts after the last call; total response time is 953 ms.</desc><style>#latency-sync-curves text {font-family: Georgia, serif;}</style><defs><marker id="latency-sync-curves-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9 z" fill="context-stroke"/></marker></defs><rect width="680" height="440" fill="#ffffff"/><g data-rg-content="true"><text x="340" y="36" text-anchor="middle" font-size="23" fill="#383a42" data-rg-title="true"><tspan x="340" dy="0">Sync: the client waits for every serial call</tspan></text>
<rect data-rg-kind="shape" x="12" y="85" width="656" height="300" rx="14" fill="#ffffff" stroke="#5c5e66" stroke-width="1"/>
<text x="340" y="125" text-anchor="middle" font-size="18" fill="#383a42"><tspan x="340" dy="0">SYNCHRONOUS — 953 ms response</tspan></text>
<rect data-rg-kind="shape" data-rg-role="teal" x="20" y="190" width="80" height="75" rx="8" fill="#e1f3fa" stroke="#0184bc" stroke-width="1.5"/>
<text x="60.0" y="233.5" text-anchor="middle" font-size="18" fill="#015f88"><tspan x="60.0" dy="0">User</tspan></text>
<rect data-rg-kind="shape" data-rg-role="teal" x="135" y="190" width="110" height="75" rx="8" fill="#e1f3fa" stroke="#0184bc" stroke-width="1.5"/>
<text x="190.0" y="221.5" text-anchor="middle" font-size="18" fill="#015f88"><tspan x="190.0" dy="0">A: DB write</tspan><tspan x="190.0" dy="24">3 ms</tspan></text>
<polyline data-rg-kind="connector" points="100,227.5 133,227.5" fill="none" stroke="#0184bc" stroke-width="2" marker-end="url(#latency-sync-curves-arrow)"/>
<polyline data-rg-kind="connector" points="245,227.5 278,227.5" fill="none" stroke="#0184bc" stroke-width="2" marker-end="url(#latency-sync-curves-arrow)"/>
<rect data-rg-kind="shape" data-rg-role="purple" x="280" y="190" width="100" height="75" rx="8" fill="#faecf9" stroke="#a626a4" stroke-width="1.5"/>
<text x="330.0" y="221.5" text-anchor="middle" font-size="18" fill="#771977"><tspan x="330.0" dy="0">Call B</tspan><tspan x="330.0" dy="24">300 ms</tspan></text>
<polyline data-rg-kind="connector" points="380,227.5 413,227.5" fill="none" stroke="#a626a4" stroke-width="2" marker-end="url(#latency-sync-curves-arrow)"/>
<rect data-rg-kind="shape" data-rg-role="purple" x="415" y="190" width="100" height="75" rx="8" fill="#faecf9" stroke="#a626a4" stroke-width="1.5"/>
<text x="465.0" y="221.5" text-anchor="middle" font-size="18" fill="#771977"><tspan x="465.0" dy="0">Call C</tspan><tspan x="465.0" dy="24">450 ms</tspan></text>
<polyline data-rg-kind="connector" points="515,227.5 548,227.5" fill="none" stroke="#a626a4" stroke-width="2" marker-end="url(#latency-sync-curves-arrow)"/>
<rect data-rg-kind="shape" data-rg-role="purple" x="550" y="190" width="110" height="75" rx="8" fill="#faecf9" stroke="#a626a4" stroke-width="1.5"/>
<text x="605.0" y="221.5" text-anchor="middle" font-size="18" fill="#771977"><tspan x="605.0" dy="0">Call D</tspan><tspan x="605.0" dy="24">200 ms</tspan></text>
<path data-rg-kind="connector" data-rg-route="bezier" data-line-meaning="response only after D completes" d="M605,265 C605,342 60,342 60,267" fill="none" stroke="#50a14f" stroke-width="2" marker-end="url(#latency-sync-curves-arrow)"/>
<text x="340" y="365" text-anchor="middle" font-size="18" fill="#3a7639"><tspan x="340" dy="0">Client waits: 3 + 300 + 450 + 200 = 953 ms</tspan></text>
<text x="340" y="420" text-anchor="middle" font-size="18" fill="#383a42"><tspan x="340" dy="0">A&#x27;s execution steps, not calls between B, C and D</tspan></text></g></svg>
