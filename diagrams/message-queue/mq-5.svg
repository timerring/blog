<svg xmlns="http://www.w3.org/2000/svg" id="mq-5" class="logic2image" role="img" aria-labelledby="mq-5-title" aria-describedby="mq-5-desc" viewBox="0 0 680 580" width="680" height="580" style="max-width:100%;height:auto"><title id="mq-5-title">A traffic burst can exceed backend capacity</title><desc id="mq-5-desc">Example database capacity 2000 requests/s, input 5000/s. Direct requests exceed capacity. Smooth traffic shape and threshold placement are qualitative, not measured.</desc><style>#mq-5 text {font-family: Georgia, serif;}</style><defs><marker id="mq-5-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9 z" fill="context-stroke"/></marker></defs><rect width="680" height="580" fill="#ffffff"/><g data-rg-content="true"><text x="340" y="36" text-anchor="middle" font-size="23" fill="#383a42" data-rg-title="true"><tspan x="340" dy="0">A traffic burst can exceed backend capacity</tspan></text>
