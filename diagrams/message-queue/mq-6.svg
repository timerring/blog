<svg xmlns="http://www.w3.org/2000/svg" id="mq-6" class="logic2image" role="img" aria-labelledby="mq-6-title" aria-describedby="mq-6-desc" viewBox="0 0 680 620" width="680" height="620" style="max-width:100%;height:auto"><title id="mq-6-title">Peak shaving: buffer arrivals, control processing</title><desc id="mq-6-desc">Example database capacity 2000 requests/s, input 5000/s. MQ grows by 3000 messages/s while A drains 2000/s. Hump and four cards are schematic, not measured traffic or exact occupancy.</desc><style>#mq-6 text {font-family: Georgia, serif;}</style><defs><marker id="mq-6-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9 z" fill="context-stroke"/></marker></defs><rect width="680" height="620" fill="#ffffff"/><g data-rg-content="true"><text x="340" y="36" text-anchor="middle" font-size="23" fill="#383a42" data-rg-title="true"><tspan x="340" dy="0">Peak shaving: buffer arrivals, control processing</tspan></text>
<rect data-rg-kind="shape" x="15" y="100" width="180" height="420" rx="10" fill="#ffffff" stroke="#5c5e66" stroke-width="1.5" stroke-dasharray="6 4"/>
<text x="30" y="127" text-anchor="start" font-size="18" fill="#383a42"><tspan x="30" dy="0">Upstream</tspan></text>
<rect data-rg-kind="shape" x="250" y="100" width="180" height="420" rx="10" fill="#ffffff" stroke="#5c5e66" stroke-width="1.5" stroke-dasharray="6 4"/>
<text x="265" y="127" text-anchor="start" font-size="18" fill="#383a42"><tspan x="265" dy="0">Message queue</tspan></text>
<rect data-rg-kind="shape" x="485" y="100" width="180" height="420" rx="10" fill="#ffffff" stroke="#5c5e66" stroke-width="1.5" stroke-dasharray="6 4"/>
<text x="500" y="127" text-anchor="start" font-size="18" fill="#383a42"><tspan x="500" dy="0">Processing</tspan></text>
<text x="105" y="165" text-anchor="middle" font-size="18" fill="#015f88"><tspan x="105" dy="0">5,000 / s input</tspan></text>
<text x="340" y="165" text-anchor="middle" font-size="18" fill="#925113"><tspan x="340" dy="0">+3,000 / s</tspan></text>
<text x="340" y="190" text-anchor="middle" font-size="18" fill="#925113"><tspan x="340" dy="0">backlog growth</tspan></text>
<text x="575" y="165" text-anchor="middle" font-size="18" fill="#771977"><tspan x="575" dy="0">2,000 / s</tspan></text>
<text x="575" y="190" text-anchor="middle" font-size="18" fill="#771977"><tspan x="575" dy="0">drain limit</tspan></text>
<path data-rg-kind="data" data-evidence="qualitative" data-description="Qualitative burst shape; no measured timestamps or rate readings" d="M35,365 C63,365 68.6,340 91,258.75 C107.8,227.5 109.2,308.75 126,308.75 C149.8,308.75 163.8,340 175,365" fill="none" stroke="#e45649" stroke-width="2.5"/>
<text x="105" y="405" text-anchor="middle" font-size="18" fill="#383a42"><tspan x="105" dy="0">Traffic shape</tspan></text>
<text x="105" y="435" text-anchor="middle" font-size="18" fill="#383a42"><tspan x="105" dy="0">Not measured</tspan></text>
<polyline data-rg-kind="connector" points="195,320 230,320 230,244 265,244" fill="none" stroke="#0184bc" stroke-width="2" marker-end="url(#mq-6-arrow)"/>
<rect data-rg-kind="shape" x="265" y="225" width="150" height="38" rx="5" fill="#fbeee2" stroke="#ca6f1e" stroke-width="1.5"/><text x="340.0" y="250.0" text-anchor="middle" font-size="18" fill="#925113">#1004</text><rect data-rg-kind="shape" x="265" y="273" width="150" height="38" rx="5" fill="#fbeee2" stroke="#ca6f1e" stroke-width="1.5"/><text x="340.0" y="298.0" text-anchor="middle" font-size="18" fill="#925113">#1003</text><rect data-rg-kind="shape" x="265" y="321" width="150" height="38" rx="5" fill="#fbeee2" stroke="#ca6f1e" stroke-width="1.5"/><text x="340.0" y="346.0" text-anchor="middle" font-size="18" fill="#925113">#1002</text><rect data-rg-kind="shape" x="265" y="369" width="150" height="38" rx="5" fill="#fbeee2" stroke="#ca6f1e" stroke-width="1.5"/><text x="340.0" y="394.0" text-anchor="middle" font-size="18" fill="#925113">#1001 (head)</text>
<text x="340" y="455" text-anchor="middle" font-size="18" fill="#383a42"><tspan x="340" dy="0">FIFO: oldest first</tspan></text>
<text x="340" y="490" text-anchor="middle" font-size="18" fill="#383a42"><tspan x="340" dy="0">4 cards: schematic</tspan></text>
<polyline data-rg-kind="connector" points="415,388 450,388 450,280 500,280" fill="none" stroke="#ca6f1e" stroke-width="2" marker-end="url(#mq-6-arrow)"/>
<rect data-rg-kind="shape" data-rg-role="purple" x="500" y="240" width="150" height="80" rx="8" fill="#faecf9" stroke="#a626a4" stroke-width="1.5"/>
<text x="575.0" y="274.0" text-anchor="middle" font-size="18" fill="#771977"><tspan x="575.0" dy="0">System A</tspan><tspan x="575.0" dy="24">worker pool</tspan></text>
<polyline data-rg-kind="connector" points="575,320 575,423" fill="none" stroke="#a626a4" stroke-width="2" marker-end="url(#mq-6-arrow)"/>
<path data-rg-kind="shape" d="M500,432 C500,408 650,408 650,432 L650,483 C650,507 500,507 500,483 Z" fill="#e6efff" stroke="#4078f2" stroke-width="1.5"/><path data-rg-kind="shape" d="M500,432 C500,456 650,456 650,432" fill="none" stroke="#4078f2" stroke-width="1.5"/>
<text x="575" y="466" text-anchor="middle" font-size="18" fill="#1a52cf"><tspan x="575" dy="0">MySQL</tspan></text>
<text x="340" y="565" text-anchor="middle" font-size="18" fill="#383a42"><tspan x="340" dy="0">1 hour at these rates → 10.8M messages queued</tspan></text>
<text x="340" y="600" text-anchor="middle" font-size="18" fill="#383a42"><tspan x="340" dy="0">Later input: 50 / s → about 92.3 min to clear</tspan></text></g></svg>
