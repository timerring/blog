<svg xmlns="http://www.w3.org/2000/svg" id="mq-7" class="logic2image" role="img" aria-labelledby="mq-7-title" aria-describedby="mq-7-desc" viewBox="0 0 680 560" width="680" height="560" style="max-width:100%;height:auto"><title id="mq-7-title">Cluster metadata is not a message replica</title><desc id="mq-7-desc">Only node 2 stores Q messages. Consumer connects to node 1; its read is forwarded to node 2.</desc><style>#mq-7 text {font-family: Georgia, serif;}</style><defs><marker id="mq-7-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9 z" fill="context-stroke"/></marker></defs><rect width="680" height="560" fill="#ffffff"/><g data-rg-content="true"><text x="340" y="36" text-anchor="middle" font-size="23" fill="#383a42" data-rg-title="true"><tspan x="340" dy="0">Cluster metadata is not a message replica</tspan></text>
<rect data-rg-kind="shape" x="20" y="100" width="190" height="210" rx="10" fill="#ffffff" stroke="#5c5e66" stroke-width="1.5" stroke-dasharray="6 4"/>
<text x="35" y="127" text-anchor="start" font-size="18" fill="#383a42"><tspan x="35" dy="0">RabbitMQ node 1</tspan></text>
<rect data-rg-kind="shape" data-rg-role="gray" x="35" y="150" width="160" height="44" rx="8" fill="#f0f0f1" stroke="#5c5e66" stroke-width="1.5"/>
<text x="115.0" y="178.0" text-anchor="middle" font-size="18" fill="#383a42"><tspan x="115.0" dy="0">Q metadata</tspan></text>
<rect data-rg-kind="shape" data-rg-role="gray" x="35" y="215" width="160" height="65" rx="8" fill="#f0f0f1" stroke="#5c5e66" stroke-width="1.5"/>
<text x="115.0" y="253.5" text-anchor="middle" font-size="18" fill="#383a42"><tspan x="115.0" dy="0">No Q messages</tspan></text>
<rect data-rg-kind="shape" x="245" y="100" width="190" height="210" rx="10" fill="#ffffff" stroke="#5c5e66" stroke-width="1.5" stroke-dasharray="6 4"/>
<text x="260" y="127" text-anchor="start" font-size="18" fill="#383a42"><tspan x="260" dy="0">RabbitMQ node 2</tspan></text>
<rect data-rg-kind="shape" data-rg-role="gray" x="260" y="150" width="160" height="44" rx="8" fill="#f0f0f1" stroke="#5c5e66" stroke-width="1.5"/>
<text x="340.0" y="178.0" text-anchor="middle" font-size="18" fill="#383a42"><tspan x="340.0" dy="0">Q metadata</tspan></text>
<rect data-rg-kind="shape" data-rg-role="coral" x="260" y="215" width="160" height="65" rx="8" fill="#fbeee2" stroke="#ca6f1e" stroke-width="1.5"/>
<text x="340.0" y="253.5" text-anchor="middle" font-size="18" fill="#925113"><tspan x="340.0" dy="0">Q: data 1, 2, 3</tspan></text>
<rect data-rg-kind="shape" x="470" y="100" width="190" height="210" rx="10" fill="#ffffff" stroke="#5c5e66" stroke-width="1.5" stroke-dasharray="6 4"/>
<text x="485" y="127" text-anchor="start" font-size="18" fill="#383a42"><tspan x="485" dy="0">RabbitMQ node 3</tspan></text>
<rect data-rg-kind="shape" data-rg-role="gray" x="485" y="150" width="160" height="44" rx="8" fill="#f0f0f1" stroke="#5c5e66" stroke-width="1.5"/>
<text x="565.0" y="178.0" text-anchor="middle" font-size="18" fill="#383a42"><tspan x="565.0" dy="0">Q metadata</tspan></text>
<rect data-rg-kind="shape" data-rg-role="gray" x="485" y="215" width="160" height="65" rx="8" fill="#f0f0f1" stroke="#5c5e66" stroke-width="1.5"/>
<text x="565.0" y="253.5" text-anchor="middle" font-size="18" fill="#383a42"><tspan x="565.0" dy="0">No Q messages</tspan></text>
<rect data-rg-kind="shape" data-rg-role="purple" x="30" y="410" width="170" height="56" rx="8" fill="#faecf9" stroke="#a626a4" stroke-width="1.5"/>
<text x="115.0" y="444.0" text-anchor="middle" font-size="18" fill="#771977"><tspan x="115.0" dy="0">Consumer</tspan></text>
<polyline data-rg-kind="connector" points="85,410 85,310" fill="none" stroke="#a626a4" stroke-width="2" marker-end="url(#mq-7-arrow)"/>
<text x="205" y="350" text-anchor="middle" font-size="18" fill="#383a42"><tspan x="205" dy="0">1. Read via node 1</tspan></text>
<polyline data-rg-kind="connector" points="195,240 260,240" fill="none" stroke="#ca6f1e" stroke-width="2" marker-end="url(#mq-7-arrow)"/>
<text x="340" y="80" text-anchor="middle" font-size="18" fill="#383a42"><tspan x="340" dy="0">2. Forward to Q owner</tspan></text>
<polyline data-rg-kind="connector" points="285,280 285,375 155,375 155,410" fill="none" stroke="#ca6f1e" stroke-width="2" marker-end="url(#mq-7-arrow)"/>
<text x="445" y="397" text-anchor="middle" font-size="18" fill="#383a42"><tspan x="445" dy="0">3. Return Q messages</tspan></text>
<text x="340" y="520" text-anchor="middle" font-size="18" fill="#a83329"><tspan x="340" dy="0">Node 2 down → Q unavailable</tspan></text>
<text x="340" y="549" text-anchor="middle" font-size="18" fill="#383a42"><tspan x="340" dy="0">Persistence preserves data, not service availability</tspan></text></g></svg>
