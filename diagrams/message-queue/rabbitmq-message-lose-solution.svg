<svg xmlns="http://www.w3.org/2000/svg" id="rabbitmq-message-lose-solution" class="logic2image" role="img" aria-labelledby="rabbitmq-message-lose-solution-title" aria-describedby="rabbitmq-message-lose-solution-desc" viewBox="0 0 680 540" width="680" height="540" style="max-width:100%;height:auto"><title id="rabbitmq-message-lose-solution-title">Match each failure boundary with its protection</title><desc id="rabbitmq-message-lose-solution-desc">Producer confirm or transactions; broker persistence and replication; consumer business commit before acknowledgement.</desc><style>#rabbitmq-message-lose-solution text {font-family: Georgia, serif;}</style><defs><marker id="rabbitmq-message-lose-solution-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9 z" fill="context-stroke"/></marker></defs><rect width="680" height="540" fill="#ffffff"/><g data-rg-content="true"><text x="340" y="36" text-anchor="middle" font-size="23" fill="#383a42" data-rg-title="true"><tspan x="340" dy="0">Match each failure boundary with its protection</tspan></text>
<rect data-rg-kind="shape" data-rg-role="teal" x="25" y="100" width="180" height="80" rx="8" fill="#e1f3fa" stroke="#0184bc" stroke-width="1.5"/>
<text x="115.0" y="146.0" text-anchor="middle" font-size="18" fill="#015f88"><tspan x="115.0" dy="0">1. Producer</tspan></text>
<polyline data-rg-kind="connector" points="205,140 275,140" fill="none" stroke="#0184bc" stroke-width="2" marker-end="url(#rabbitmq-message-lose-solution-arrow)"/>
<rect data-rg-kind="shape" data-rg-role="teal" x="275" y="100" width="380" height="80" rx="8" fill="#e1f3fa" stroke="#0184bc" stroke-width="1.5"/>
<text x="465.0" y="134.0" text-anchor="middle" font-size="18" fill="#015f88"><tspan x="465.0" dy="0">Publisher confirms + tracked retries</tspan><tspan x="465.0" dy="24">Alternative: channel transactions</tspan></text>
<rect data-rg-kind="shape" data-rg-role="coral" x="25" y="245" width="180" height="80" rx="8" fill="#fbeee2" stroke="#ca6f1e" stroke-width="1.5"/>
<text x="115.0" y="291.0" text-anchor="middle" font-size="18" fill="#925113"><tspan x="115.0" dy="0">2. Broker</tspan></text>
<polyline data-rg-kind="connector" points="205,285 275,285" fill="none" stroke="#ca6f1e" stroke-width="2" marker-end="url(#rabbitmq-message-lose-solution-arrow)"/>
<rect data-rg-kind="shape" data-rg-role="coral" x="275" y="245" width="380" height="80" rx="8" fill="#fbeee2" stroke="#ca6f1e" stroke-width="1.5"/>
<text x="465.0" y="279.0" text-anchor="middle" font-size="18" fill="#925113"><tspan x="465.0" dy="0">Durable queue / message semantics</tspan><tspan x="465.0" dy="24">Replicated queue where required</tspan></text>
<rect data-rg-kind="shape" data-rg-role="purple" x="25" y="390" width="180" height="80" rx="8" fill="#faecf9" stroke="#a626a4" stroke-width="1.5"/>
<text x="115.0" y="436.0" text-anchor="middle" font-size="18" fill="#771977"><tspan x="115.0" dy="0">3. Consumer</tspan></text>
<polyline data-rg-kind="connector" points="205,430 275,430" fill="none" stroke="#a626a4" stroke-width="2" marker-end="url(#rabbitmq-message-lose-solution-arrow)"/>
<rect data-rg-kind="shape" data-rg-role="purple" x="275" y="390" width="380" height="80" rx="8" fill="#faecf9" stroke="#a626a4" stroke-width="1.5"/>
<text x="465.0" y="424.0" text-anchor="middle" font-size="18" fill="#771977"><tspan x="465.0" dy="0">Commit business → manual ack</tspan><tspan x="465.0" dy="24">Repeated delivery → idempotency</tspan></text>
<text x="340" y="523" text-anchor="middle" font-size="18" fill="#383a42"><tspan x="340" dy="0">Confirm and channel transactions are alternative modes</tspan></text></g></svg>
