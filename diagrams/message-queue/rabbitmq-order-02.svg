<svg xmlns="http://www.w3.org/2000/svg" id="rabbitmq-order-02" class="logic2image" role="img" aria-labelledby="rabbitmq-order-02-title" aria-describedby="rabbitmq-order-02-desc" viewBox="0 0 680 680" width="680" height="680" style="max-width:100%;height:auto"><title id="rabbitmq-order-02-title">RabbitMQ: route each key to one serial consumer</title><desc id="rabbitmq-order-02-desc">Same-key data1/2/3 enter Q2 and C2 handles them serially.</desc><style>#rabbitmq-order-02 text {font-family: Georgia, serif;}</style><defs><marker id="rabbitmq-order-02-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9 z" fill="context-stroke"/></marker></defs><rect width="680" height="680" fill="#ffffff"/><g data-rg-content="true"><text x="340" y="36" text-anchor="middle" font-size="23" fill="#383a42" data-rg-title="true"><tspan x="340" dy="0">RabbitMQ: route each key to one serial consumer</tspan></text>
<rect data-rg-kind="shape" data-rg-role="teal" x="245" y="75" width="190" height="56" rx="8" fill="#e1f3fa" stroke="#0184bc" stroke-width="1.5"/>
<text x="340.0" y="109.0" text-anchor="middle" font-size="18" fill="#015f88"><tspan x="340.0" dy="0">Producer</tspan></text>
<text x="25" y="185" text-anchor="start" font-size="18" fill="#383a42"><tspan x="25" dy="0">Same key:</tspan><tspan x="25" dy="24">data1 → data2 → data3</tspan></text>
<polyline data-rg-kind="connector" points="340,131 340,270" fill="none" stroke="#0184bc" stroke-width="2" marker-end="url(#rabbitmq-order-02-arrow)"/>
<text x="365" y="230" text-anchor="start" font-size="18" fill="#383a42"><tspan x="365" dy="0">hash(key) → Q2</tspan></text>
<rect data-rg-kind="shape" data-rg-role="coral" x="25" y="270" width="170" height="56" rx="8" fill="#fbeee2" stroke="#ca6f1e" stroke-width="1.5"/>
<text x="110.0" y="304.0" text-anchor="middle" font-size="18" fill="#925113"><tspan x="110.0" dy="0">Queue 1</tspan></text>
<rect data-rg-kind="shape" data-rg-role="coral" x="255" y="270" width="170" height="80" rx="8" fill="#fbeee2" stroke="#ca6f1e" stroke-width="1.5"/>
<text x="340.0" y="304.0" text-anchor="middle" font-size="18" fill="#925113"><tspan x="340.0" dy="0">Queue 2</tspan><tspan x="340.0" dy="24">[1 → 2 → 3]</tspan></text>
<rect data-rg-kind="shape" data-rg-role="coral" x="485" y="270" width="170" height="56" rx="8" fill="#fbeee2" stroke="#ca6f1e" stroke-width="1.5"/>
<text x="570.0" y="304.0" text-anchor="middle" font-size="18" fill="#925113"><tspan x="570.0" dy="0">Queue 3</tspan></text>
<polyline data-rg-kind="connector" points="110,326 110,410" fill="none" stroke="#ca6f1e" stroke-width="2" marker-end="url(#rabbitmq-order-02-arrow)"/>
<rect data-rg-kind="shape" data-rg-role="purple" x="25" y="410" width="170" height="56" rx="8" fill="#faecf9" stroke="#a626a4" stroke-width="1.5"/>
<text x="110.0" y="444.0" text-anchor="middle" font-size="18" fill="#771977"><tspan x="110.0" dy="0">Consumer 1</tspan></text>
<text x="110" y="495" text-anchor="middle" font-size="18" fill="#383a42"><tspan x="110" dy="0">serial worker</tspan></text>
<polyline data-rg-kind="guide" points="180,466 180,535" fill="none" stroke="#5c5e66" stroke-width="1.5"/>
<polyline data-rg-kind="connector" points="340,350 340,410" fill="none" stroke="#ca6f1e" stroke-width="2" marker-end="url(#rabbitmq-order-02-arrow)"/>
<rect data-rg-kind="shape" data-rg-role="purple" x="255" y="410" width="170" height="56" rx="8" fill="#faecf9" stroke="#a626a4" stroke-width="1.5"/>
<text x="340.0" y="444.0" text-anchor="middle" font-size="18" fill="#771977"><tspan x="340.0" dy="0">Consumer 2</tspan></text>
<text x="340" y="495" text-anchor="middle" font-size="18" fill="#383a42"><tspan x="340" dy="0">serial worker</tspan></text>
<polyline data-rg-kind="guide" points="410,466 410,535" fill="none" stroke="#5c5e66" stroke-width="1.5"/>
<polyline data-rg-kind="connector" points="570,326 570,410" fill="none" stroke="#ca6f1e" stroke-width="2" marker-end="url(#rabbitmq-order-02-arrow)"/>
<rect data-rg-kind="shape" data-rg-role="purple" x="485" y="410" width="170" height="56" rx="8" fill="#faecf9" stroke="#a626a4" stroke-width="1.5"/>
<text x="570.0" y="444.0" text-anchor="middle" font-size="18" fill="#771977"><tspan x="570.0" dy="0">Consumer 3</tspan></text>
<text x="570" y="495" text-anchor="middle" font-size="18" fill="#383a42"><tspan x="570" dy="0">serial worker</tspan></text>
<polyline data-rg-kind="guide" points="640,466 640,535" fill="none" stroke="#5c5e66" stroke-width="1.5"/>
<polyline data-rg-kind="guide" points="180,535 640,535" fill="none" stroke="#5c5e66" stroke-width="1.5"/>
<polyline data-rg-kind="connector" points="340,535 340,570" fill="none" stroke="#a626a4" stroke-width="2" marker-end="url(#rabbitmq-order-02-arrow)"/>
<rect data-rg-kind="shape" data-rg-role="green" x="110" y="570" width="460" height="65" rx="8" fill="#e8f3e2" stroke="#50a14f" stroke-width="1.5"/>
<text x="340.0" y="608.5" text-anchor="middle" font-size="18" fill="#3a7639"><tspan x="340.0" dy="0">Database: data1 → data2 → data3</tspan></text>
<text x="340" y="667" text-anchor="middle" font-size="18" fill="#383a42"><tspan x="340" dy="0">Different keys can use Q1 / Q3</tspan></text></g></svg>
