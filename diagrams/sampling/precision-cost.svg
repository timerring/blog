<svg xmlns="http://www.w3.org/2000/svg" id="precision-cost" class="logic2image" width="100%" viewBox="0 0 640 462" role="img" aria-labelledby="precision-cost-title" aria-describedby="precision-cost-desc" style="display:block;min-width:560px;max-width:640px;margin-inline:auto">
<title id="precision-cost-title">More precision means more tests</title>
<desc id="precision-cost-desc">At 95% confidence and p equal to 0.5, large-population counts are 97, 385, 1,068 and 9,604 for margins of 10, 5, 3 and 1 percentage points. Bar lengths share a zero baseline.</desc>
<style>#precision-cost text {font-family:Georgia,serif;font-size:18px;fill:#383a42}</style>
<rect width="640" height="462" fill="#ffffff" data-rg-kind="shape"/>
<text data-rg-title="true" x="320" y="35" text-anchor="middle" style="font-size:23px">More precision means more tests</text>
<g data-rg-content="true">
<text x="24" y="76" text-anchor="start" style="fill:#383a42;font-size:18px">Margin of error</text><text x="132" y="105" text-anchor="start" style="fill:#383a42;font-size:18px">Required tests (shared linear scale)</text><text x="106" y="158" text-anchor="end" style="fill:#383a42;font-size:18px">±10 points</text><rect data-rg-kind="data" x="132" y="137" width="4.074" height="28" fill="#e1f3fa" stroke="#0184bc" stroke-width="1.5"/><text x="145.074" y="158" text-anchor="start" style="fill:#015f88;font-size:18px">97</text><text x="106" y="219" text-anchor="end" style="fill:#383a42;font-size:18px">±5 points</text><rect data-rg-kind="data" x="132" y="198" width="16.169999999999998" height="28" fill="#fbeee2" stroke="#ca6f1e" stroke-width="1.5"/><text x="157.17" y="219" text-anchor="start" style="fill:#925113;font-size:18px">385</text><text x="106" y="280" text-anchor="end" style="fill:#383a42;font-size:18px">±3 points</text><rect data-rg-kind="data" x="132" y="259" width="44.856" height="28" fill="#e1f3fa" stroke="#0184bc" stroke-width="1.5"/><text x="185.856" y="280" text-anchor="start" style="fill:#015f88;font-size:18px">1,068</text><text x="106" y="341" text-anchor="end" style="fill:#383a42;font-size:18px">±1 points</text><rect data-rg-kind="data" x="132" y="320" width="403.368" height="28" fill="#e1f3fa" stroke="#0184bc" stroke-width="1.5"/><text x="544.3679999999999" y="341" text-anchor="start" style="fill:#015f88;font-size:18px">9,604</text><path data-rg-kind="guide" d="M132.0,363 v7" stroke="#5c5e66"/><text x="132.0" y="393" text-anchor="middle" style="fill:#383a42;font-size:18px">0</text><path data-rg-kind="guide" d="M237.0,363 v7" stroke="#5c5e66"/><text x="237.0" y="393" text-anchor="middle" style="fill:#383a42;font-size:18px">2,500</text><path data-rg-kind="guide" d="M342.0,363 v7" stroke="#5c5e66"/><text x="342.0" y="393" text-anchor="middle" style="fill:#383a42;font-size:18px">5,000</text><path data-rg-kind="guide" d="M447.0,363 v7" stroke="#5c5e66"/><text x="447.0" y="393" text-anchor="middle" style="fill:#383a42;font-size:18px">7,500</text><path data-rg-kind="guide" d="M552.0,363 v7" stroke="#5c5e66"/><text x="552.0" y="393" text-anchor="middle" style="fill:#383a42;font-size:18px">10,000</text><text x="320" y="435" text-anchor="middle" style="fill:#383a42;font-size:18px">Large population · 95% confidence · p = 0.5</text>
