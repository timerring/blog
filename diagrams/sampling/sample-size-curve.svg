<svg xmlns="http://www.w3.org/2000/svg" id="sampling-curve" class="logic2image" viewBox="0 0 640 470" width="100%" role="img" aria-labelledby="sampling-title" aria-describedby="sampling-desc" style="display:block;min-width:560px;max-width:640px;margin-inline:auto">
<title id="sampling-title">Larger populations, diminishing sample growth</title>
<desc id="sampling-desc">At 95% confidence, plus or minus 5 percentage points, and p equal to 0.5, inspect 80 of 100 items, 278 of 1,000, or 370 of 10,000. The population axis is logarithmic; inspection counts approach the rounded large-population recommendation of 385.</desc>
