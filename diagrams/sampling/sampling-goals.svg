<svg xmlns="http://www.w3.org/2000/svg" id="sampling-goals" class="logic2image" width="100%" viewBox="0 0 640 450" role="img" aria-labelledby="sampling-goals-title" aria-describedby="sampling-goals-desc" style="display:block;min-width:560px;max-width:640px;margin-inline:auto">
<title id="sampling-goals-title">Which sampling question are you asking?</title>
<desc id="sampling-goals-desc">Three different goals need different methods: proportion estimation, rare-defect detection, and batch acceptance. Only proportion estimation is handled by this calculator.</desc>
<style>#sampling-goals text {font-family:Georgia,serif;font-size:18px;fill:#383a42}</style>
<rect width="640" height="450" fill="#ffffff" data-rg-kind="shape"/>
<text data-rg-title="true" x="320" y="35" text-anchor="middle" style="font-size:23px">Which sampling question are you asking?</text>
<g data-rg-content="true">
<rect data-rg-kind="shape" x="24" y="67" width="592" height="96" rx="6" fill="#e1f3fa" stroke="#0184bc"/><text x="42" y="93" text-anchor="start" style="fill:#015f88;font-size:20px">Estimate a proportion</text><text x="42" y="120" text-anchor="start" style="fill:#383a42;font-size:18px">What fraction is defective?</text><text x="42" y="146" text-anchor="start" style="fill:#015f88;font-size:18px">Confidence + margin of error</text><rect data-rg-kind="shape" x="24" y="179" width="592" height="96" rx="6" fill="#faecf9" stroke="#a626a4"/><text x="42" y="205" text-anchor="start" style="fill:#771977;font-size:20px">Detect a rare defect</text><text x="42" y="232" text-anchor="start" style="fill:#383a42;font-size:18px">Will we find at least one?</text><text x="42" y="258" text-anchor="start" style="fill:#771977;font-size:18px">Detection probability + assumed rate</text><rect data-rg-kind="shape" x="24" y="291" width="592" height="96" rx="6" fill="#fbeee2" stroke="#ca6f1e"/><text x="42" y="317" text-anchor="start" style="fill:#925113;font-size:20px">Accept or reject a batch</text><text x="42" y="344" text-anchor="start" style="fill:#383a42;font-size:18px">Should we accept this lot?</text><text x="42" y="370" text-anchor="start" style="fill:#925113;font-size:18px">Acceptance plan + decision thresholds</text><text x="320" y="424" text-anchor="middle" style="fill:#383a42;font-size:18px">The calculator answers the first question only.</text>
</g></svg>
